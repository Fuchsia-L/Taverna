version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: taverna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taverna
      POSTGRES_USER: taverna
      POSTGRES_PASSWORD: taverna
    ports:
      - "5432:5432"
    volumes:
      - taverna_pg_data:/var/lib/postgresql/data

volumes:
  taverna_pg_data:
